name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: windows-vs-x64
            build_preset: windows-vs-x64-relwithdebinfo
            config: RelWithDebInfo
            arch_suffix: x64
            fmod_dir: bin64
          - preset: windows-vs-x86
            build_preset: windows-vs-x86-relwithdebinfo
            config: RelWithDebInfo
            arch_suffix: x86
            fmod_dir: bin86

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3

      - name: Configure (${{ matrix.preset }})
        run: cmake --preset ${{ matrix.preset }}
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Build (${{ matrix.build_preset }})
        run: cmake --build --preset ${{ matrix.build_preset }}
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p stage
          cp "out/build/${{ matrix.preset }}/${{ matrix.config }}/OpenLR2_${{ matrix.arch_suffix }}.exe" stage/
          cp "dep/FMOD/${{ matrix.fmod_dir }}/fmod.dll" stage/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenLR2-${{ matrix.arch_suffix }}-${{ matrix.config }}
          path: stage/
